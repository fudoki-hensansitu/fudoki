for(const[name,ink,dark]of [["今の緑","#2f5d43","#8fbfa2"],["墨色","#292d32","#b5bbc3"],["藍色","#243b53","#9eb8d2"],["深緑","#183d30","#8fb99d"]]){const b=document.createElement("button");b.type="button";b.textContent=name;b.dataset.ink=ink;b.addEventListener("click",()=>{state.ink=ink;state.inkDark=dark;sync();change()});$("presets").append(b)}

function tab(next){mode=next;for(const m of ["position","color"]){$(m+"Panel").hidden=m!==mode;$(m+"Tab").setAttribute("aria-selected",String(m===mode));$(m+"Tab").tabIndex=m===mode?0:-1}$("hint").textContent=mode==="position"?"各文字を左右にドラッグしてカーニング。文字全体・マークは自由に移動。丸はサイズ、字間の数値もドラッグできます。Shiftで軸を固定。":"短冊と文字は同じ色。細い下線だけ濃さを補正します。0で同じ色になり、強調色は元のオレンジのままです。";render()}
for(const m of ["position","color"]){$(m+"Tab").addEventListener("click",()=>tab(m));$(m+"Tab").addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="ArrowRight"){e.preventDefault();const next=mode==="position"?"color":"position";tab(next);$(next+"Tab").focus()}})}
function move(kind,base,dx,dy){if(kind==="text"){state.textOffsetY=limited("textOffsetY",base.textOffsetY+dy);state.gap=limited("gap",base.gap+dx)}else if(kind==="mark"){const shift=Math.max(Math.max(-base.markOffsetX,base.gap-24),Math.min(Math.min(8-base.markOffsetX,base.gap),dx));state.markOffsetX=limited("markOffsetX",base.markOffsetX+shift);state.gap=limited("gap",base.gap-(state.markOffsetX-base.markOffsetX));state.markOffsetY=limited("markOffsetY",base.markOffsetY+dy)}else if(kind.startsWith("glyph")){const i=Number(kind.slice(-1)),unit=1;if(i===0){const delta=Math.max(Math.max(-base.gap,(base.pairGaps[0]-12)/unit),Math.min(Math.min(24-base.gap,base.pairGaps[0]/unit),dx));state.gap=limited("gap",base.gap+delta);state.pairGaps[0]=limited("pair0",base.pairGaps[0]-(state.gap-base.gap)*unit)}else if(i===1){const delta=limited("pair0",Math.max(Math.max(0,base.pairGaps[0]+base.pairGaps[1]-12),Math.min(Math.min(12,base.pairGaps[0]+base.pairGaps[1]),base.pairGaps[0]+dx*unit)));state.pairGaps[0]=delta;state.pairGaps[1]=limited("pair1",base.pairGaps[0]+base.pairGaps[1]-delta)}else state.pairGaps[1]=limited("pair1",base.pairGaps[1]+dx*unit)}else if(kind.startsWith("pair")){const i=Number(kind.slice(-1));state.pairGaps[i]=limited(kind,base.pairGaps[i]+dx)}else if(kind==="text-size")state.textSize=limited("textSize",base.textSize*(1+dx/(paths(base,0).right-base.pairGaps[0]-base.pairGaps[1])));else if(kind==="mark-size"){const min=Math.max(.75,base.markScale+(base.gap-24)/markRight(base)),max=Math.min(1.5,base.markScale+base.gap/markRight(base));state.markScale=limited("markScale",Math.max(min,Math.min(max,base.markScale+dx/geometry(base).at(-1)[2])));state.gap=limited("gap",base.gap-markRight(base)*(state.markScale-base.markScale))}sync();change()}
$("stage").addEventListener("pointerdown",e=>{const t=e.target.closest("[data-drag]");if(!t||mode!=="position"||e.button!==0)return;const matrix=t.ownerSVGElement.getScreenCTM().inverse();drag={kind:t.dataset.drag,base:clone(state),matrix,start:new DOMPoint(e.clientX,e.clientY).matrixTransform(matrix),id:e.pointerId};$("stage").setPointerCapture(e.pointerId);e.preventDefault()});
$("stage").addEventListener("pointermove",e=>{if(!drag||e.pointerId!==drag.id)return;const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(drag.matrix);let dx=p.x-drag.start.x,dy=p.y-drag.start.y;if(e.shiftKey){if(Math.abs(dx)>=Math.abs(dy))dy=0;else dx=0}move(drag.kind,drag.base,dx,dy)});
function finish(e){if(!drag||e.pointerId!==drag.id)return;drag=null;draw()}
for(const ev of ["pointerup","pointercancel","lostpointercapture"])$("stage").addEventListener(ev,finish);
$("stage").addEventListener("keydown",e=>{const t=e.target.closest("[data-drag]");if(!t||!e.key.startsWith("Arrow"))return;const step=e.shiftKey?1:.25,kind=t.dataset.drag;let dx=e.key==="ArrowRight"?step:e.key==="ArrowLeft"?-step:0,dy=e.key==="ArrowDown"?step:e.key==="ArrowUp"?-step:0;if(kind.endsWith("size")||kind.startsWith("pair"))dx=dx||-dy;e.preventDefault();move(kind,clone(state),dx,dy);$("stage").querySelector(`[data-drag="${kind}"]`).focus({preventScroll:true})});
$("dark").addEventListener("change",render);$("reset").addEventListener("click",()=>{state=clone(DEFAULTS);sync();change()});
function updateProduct(){if(!productReady)return;const d=$("product").contentDocument;d.documentElement.classList.toggle("dark",$("dark").checked);d.documentElement.style.setProperty("--primary",state.accent);for(const i of d.images){const n=i.dataset.logoEditorAsset||(i.getAttribute("src")||"").split("/").pop();if(!/^(mark|logo)(-dark)?\.svg$/.test(n))continue;i.dataset.logoEditorAsset=n;i.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg(state,n.startsWith("mark")?"mark":"logo",n.includes("-dark")))}}
$("live").addEventListener("toggle",()=>{if(!$("live").open||$("product").getAttribute("src"))return;$("liveStatus").textContent="実画面を読み込んでいます…";$("product").hidden=false;$("product").src=location.protocol.startsWith("http")?location.origin+"/pipeline/":"about:blank"});
$("product").addEventListener("load",()=>{try{const d=$("product").contentDocument;if(!d||!location.protocol.startsWith("http"))throw Error();const connect=()=>{if(!Array.from(d.images).some(i=>(i.getAttribute("src")||"").endsWith("/logo.svg")))return false;productReady=true;updateProduct();$("liveStatus").textContent="マーク24px・横組み40pxに反映。強調色は元のオレンジです。";const i=Array.from(d.images).find(i=>i.dataset.logoEditorAsset==="logo.svg"),r=i.getBoundingClientRect();d.defaultView.scrollTo(0,d.defaultView.scrollY+r.top-(d.defaultView.innerHeight-r.height)/2);return true};if(connect())return;const observer=new MutationObserver(()=>{if(Array.from(d.images).some(i=>(i.getAttribute("src")||"").endsWith("/logo.svg"))){observer.disconnect();connect()}});observer.observe(d.documentElement,{childList:true,subtree:true});setTimeout(()=>{observer.disconnect();if(!productReady)$("liveStatus").textContent="実画面を読み込めません。ローカル開発サーバーで確認してください。"},8000)}catch(e){$("liveStatus").textContent="実画面はローカル開発サーバーで確認できます。"}});
sync();render();window.logoEditor={getState:()=>clone(state),svg,defaults:clone(DEFAULTS)};
</script></body></html>
