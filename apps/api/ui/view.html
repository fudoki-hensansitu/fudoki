<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>風土記</title>
<style>
  /* host の CSS 変数（MCP Apps の hostContext.styles）を使い、無ければ既定の値 */
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, #fff);
    --bg2: var(--color-background-secondary, #f5f5f4);
    --fg: var(--color-text-primary, #1c1917);
    --fg2: var(--color-text-secondary, #57534e);
    --line: var(--color-border-primary, #e7e5e4);
    --accent: var(--color-text-info, #1d4ed8);
    --radius: var(--border-radius-md, 6px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-background-primary, #1c1917);
      --bg2: var(--color-background-secondary, #292524);
      --fg: var(--color-text-primary, #f5f5f4);
      --fg2: var(--color-text-secondary, #a8a29e);
      --line: var(--color-border-primary, #44403c);
      --accent: var(--color-text-info, #93c5fd);
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #1c1917);
    --bg2: var(--color-background-secondary, #292524);
    --fg: var(--color-text-primary, #f5f5f4);
    --fg2: var(--color-text-secondary, #a8a29e);
    --line: var(--color-border-primary, #44403c);
    --accent: var(--color-text-info, #93c5fd);
  }
  body {
    margin: 0;
    padding: 12px 16px;
    background: var(--bg);
    color: var(--fg);
    font: var(--font-text-sm-size, 14px) / var(--font-text-sm-line-height, 1.5) var(--font-sans, system-ui, sans-serif);
  }
  #root[aria-busy="true"] { opacity: 0.6; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--fg2); font-weight: var(--font-weight-medium, 500); white-space: nowrap; }
  .table-wrap { overflow-x: auto; }
  tr.row { cursor: pointer; }
  tr.row:hover, tr.row.open { background: var(--bg2); }
  tr.row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .detail-row > td { background: var(--bg2); }
  .detail h4 { margin: 8px 0 4px; font-size: inherit; }
  .detail ul { margin: 0 0 8px; padding-left: 1.2em; }
  .mono { font-family: var(--font-mono, ui-monospace, monospace); }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .big { font-size: 1.4em; text-align: left; }
  .muted { color: var(--fg2); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { border: 1px solid var(--line); border-radius: var(--border-radius-full, 999px); padding: 0 8px; white-space: nowrap; }
  .chip.settlement { border-color: var(--accent); }
  .kind { color: var(--fg2); font-size: 0.85em; }
  a.origin { color: var(--accent); display: inline-block; max-width: 24em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
  td.name { min-width: 8em; }
  td.locs { min-width: 7em; }
  .nowrap { white-space: nowrap; }
  .small { font-size: 0.85em; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  input[type="search"] { flex: 1 1 14em; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); color: var(--fg); font: inherit; }
  button { font: inherit; color: var(--fg); background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 12px; cursor: pointer; }
  button.link { background: none; border: none; padding: 0; color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  .pager { margin-top: 8px; }
  .head { margin-bottom: 12px; }
  .head h3 { margin: 4px 0; }
  .error { color: var(--color-text-danger, #b91c1c); }
</style>
</head>
<body>
<main id="root"><p class="muted">読み込み中…</p></main>
<!-- script -->
</body>
</html>
