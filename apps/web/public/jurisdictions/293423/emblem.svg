<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" 
  "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="500" height="400" viewBox="-10 -3 20 16" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1">
  <desc>Emblem of Heguri, Nara</desc>
  <clipPath id="mask">
    <rect x="-9" y="-2" rx="2" ry="2" width="18" height="14" />
  </clipPath>
  <g clip-path="url(#mask)">
    <g id="g2" stroke="#028a39" stroke-width="4" stroke-linecap="round">
      <g id="g1">
        <line x1="-7" y1="0" x2="7" y2="-5" />
      </g>
      <use xlink:href="#g1" transform="translate(0, 5)" />
    </g>
    <use xlink:href="#g2" transform="translate(0, 10)" />
  </g>
</svg>