<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" 
  "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="400" height="400" viewBox="-200 -220 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1">
  <desc>Emblem of Takanabe, Miyazaki</desc>
  <clipPath id="mask">
    <rect id="r" x="-180" y="-180" width="360" height="172" />
    <use xlink:href="#r" transform="scale(1,-1)" />
  </clipPath>
  <g clip-path="url(#mask)">
    <circle r="115" stroke="#880016" stroke-width="90" fill="none" />
  </g>
  <g id="t">
    <polyline id="a" points="0,-200 0,-140 -60,-140" fill="#880016" transform="rotate(-15 0 -200)" />
    <use xlink:href="#a" transform="scale(-1,1)" />
  </g>
  <use xlink:href="#t" transform="rotate(120)" />
  <use xlink:href="#t" transform="rotate(240)" />
  <use xlink:href="#t" transform="rotate(180 0 -115)" />
</svg>