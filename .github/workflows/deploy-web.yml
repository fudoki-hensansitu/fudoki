name: deploy-web
# main に入った公開 web（fudoki.dev の入口の1枚）の変更をデプロイする。
# web は api の型（Hono RPC）で api を呼ぶので、api も変わった push では deploy-api の完了を待ってから出す
on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - apps/api/src/rpc.ts
      - apps/api/src/*/model.ts
      - package.json
      - bun.lock
      - bunfig.toml
      - mise.toml
      - tsconfig.json
      - .github/workflows/deploy-web.yml
  workflow_run:
    workflows: [deploy-api]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-web
  cancel-in-progress: false
jobs:
  deploy:
    # 手動実行でも main 以外の branch は出さない。deploy-api の後は、それが成功したときだけ出す
    if: >-
      (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # push: deploy-api も動く push（その paths に当たる変更を1つでも含む）は、deploy-api の完了から出す。
      # workflow_run: deploy-api を走らせた commit が main の先頭でなければ出さない（後の push・deploy-api が新しい web を出す）
      - id: order
        if: github.event_name != 'workflow_dispatch'
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = push ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
            if git diff --name-only "$BEFORE" HEAD | grep -qE '^(apps/api/|package\.json$|bun\.lock$|bunfig\.toml$|mise\.toml$|tsconfig\.json$|\.github/workflows/deploy-api\.yml$)'; then
              echo "wait=true" >> "$GITHUB_OUTPUT"
            fi
          else
            git fetch --no-tags --depth=1 origin main
            if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
              echo "wait=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - if: steps.order.outputs.wait != 'true'
        uses: jdx/mise-action@v5
        with:
          version: 2026.8.6
      - if: steps.order.outputs.wait != 'true'
        run: bun install --frozen-lockfile
      - if: steps.order.outputs.wait != 'true'
        run: bun run deploy:web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
