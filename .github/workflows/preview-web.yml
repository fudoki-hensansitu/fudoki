name: preview-web
# PR ごとに公開 web（fudoki.dev）の preview を pr-<番号>.fudoki.dev に出す。push のたびに同じ URL を更新する
# PR を閉じたら（merge を含む）preview を消す。cf には削除のコマンドが無いので wrangler を使う
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - apps/web/**
      - package.json
      - bun.lock
      - bunfig.toml
      - mise.toml
      - tsconfig.json
      - .github/workflows/preview-web.yml
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: preview-web-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    # fork の PR には secrets が渡らないので出さない
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.8.6
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/web client
      - run: mise exec -- cf previews deploy "pr-${{ github.event.pull_request.number }}"
        working-directory: apps/web/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: |
          gh pr comment "$PR" --edit-last --create-if-none --body "Preview: https://pr-$PR.fudoki.dev （push のたびに更新）"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.8.6
      - run: bunx wrangler@4.151.0 preview delete --name "pr-${{ github.event.pull_request.number }}" --worker-name fudoki --skip-confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
