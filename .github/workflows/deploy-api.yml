name: deploy-api
# main に入った API の変更を api.fudoki.dev へデプロイする。D1 の migration・データの投入はしない
on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - package.json
      - bun.lock
      - bunfig.toml
      - mise.toml
      - tsconfig.json
      - .github/workflows/deploy-api.yml
  workflow_dispatch:
permissions:
  contents: read
# 前のデプロイを途中で止めず、順に出す
concurrency:
  group: deploy-api
  cancel-in-progress: false
jobs:
  deploy:
    # 手動実行でも main 以外の branch は出さない
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.8.6
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/api test
      - run: bun run deploy:api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
