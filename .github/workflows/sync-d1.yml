name: sync-d1
# main に入った取り込み・dbt の変更を、marts に build して本番 D1（fudoki-api）へ差分で写す（ADR 0040）。
# 範囲は serving/scope.py が差分から決める。取り込みの宣言・選定・自治体の列を持つ seed だけならその自治体だけ、
# 全自治体に効く変更なら全件。施策・事業の紐付けの seed（project:link-*）は取り込みの PR で commit しておく。
on:
  push:
    branches: [main]
    paths:
      - pipeline/**
      - packages/jurisdictions/**
      - packages/fiscal/**
      - apps/api/src/columns.json
      - uv.lock
      - mise.toml
  workflow_dispatch:
    inputs:
      jurisdictions:
        description: 自治体コード（空白区切り）。空なら全件
        required: false
        default: ''
permissions:
  contents: read
# serving:sync は同時に2つ流せない（`<表>__new` が衝突する）。前の同期を止めず、順に流す
concurrency:
  group: sync-d1
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          CODES: ${{ inputs.jurisdictions }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            codes="$CODES"
            for c in $codes; do [[ "$c" =~ ^[0-9]{6}$ ]] || { echo "not a jurisdiction code: $c"; exit 1; }; done
            if [ -z "$codes" ]; then echo 'mode=full' >> "$GITHUB_OUTPUT"; else echo 'mode=jurisdictions' >> "$GITHUB_OUTPUT"; fi
            echo "args=$(for c in $codes; do printf -- '--jurisdiction %s ' "$c"; done)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="$BEFORE"
          if ! git cat-file -e "$before^{commit}" 2>/dev/null; then echo 'mode=full' >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 pipeline/serving/scope.py --base "$before" --head "${{ github.sha }}" | tee "$RUNNER_TEMP/scope.json"
          echo "mode=$(jq -r .mode "$RUNNER_TEMP/scope.json")" >> "$GITHUB_OUTPUT"
          echo "args=$(jq -r '[.jurisdictions[] | "--jurisdiction " + .] | join(" ")' "$RUNNER_TEMP/scope.json")" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.mode != 'none'
        uses: jdx/mise-action@v5
        with:
          version: 2026.8.6
      - if: steps.scope.outputs.mode != 'none'
        run: bun install --frozen-lockfile
      - if: steps.scope.outputs.mode != 'none'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - if: steps.scope.outputs.mode != 'none'
        run: |
          for wait in 30 60 0; do
            uv sync --frozen && exit 0
            sleep "$wait"
          done
          exit 1
      # R2 から戻した取り込みの表・出典と、事業の PDF を読んだ結果。毎回新しい key で保存して温めておく
      - if: steps.scope.outputs.mode != 'none'
        uses: actions/cache/restore@v6
        with:
          path: pipeline/.cache
          key: pipeline-cache-${{ hashFiles('mise.toml') }}-${{ github.run_id }}
          restore-keys: pipeline-cache-${{ hashFiles('mise.toml') }}-
      - if: steps.scope.outputs.mode != 'none'
        run: bun run --cwd pipeline dbt:build -- --remote ${{ steps.scope.outputs.args }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # 自治体で絞った build のときは --jurisdiction を必ず付ける（付けないと他の自治体の行が消える）
      - if: steps.scope.outputs.mode != 'none'
        run: bun run --cwd pipeline serving:sync -- --database-id b9b6f209-083e-45b3-a896-1014a17a15f9 ${{ steps.scope.outputs.args }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - if: always() && steps.scope.outputs.mode != 'none'
        uses: actions/cache/save@v6
        with:
          path: pipeline/.cache
          key: pipeline-cache-${{ hashFiles('mise.toml') }}-${{ github.run_id }}
