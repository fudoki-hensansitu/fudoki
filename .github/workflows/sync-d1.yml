name: sync-d1
# main に入った取り込み・dbt の変更を、marts に build して本番 D1（fudoki-api）へ差分で写す（ADR 0040）。
# 範囲は serving/publish.py（bun run --cwd pipeline publish）が差分から決める。取り込みの宣言・選定・自治体の列を持つ seed だけならその自治体だけ、
# 全自治体に効く変更なら全件。施策・事業の紐付けの seed（project:link-*）は取り込みの PR で commit しておく。
on:
  push:
    branches: [main]
    paths:
      - pipeline/**
      - packages/jurisdictions/**
      - packages/fiscal/**
      - apps/api/src/columns.json
      - uv.lock
      - pyproject.toml
      - mise.toml
  workflow_dispatch:
    inputs:
      jurisdictions:
        description: 自治体コード（空白区切り）。空なら全件
        required: false
        default: ''
permissions:
  contents: read
  actions: read
# serving:sync は同時に2つ流せない（`<表>__new` が衝突する）。前の同期を止めず、順に流す。
# 待てる run は1本だけで、それより前の待ちは取り消されるが、範囲は最後に成功した同期から決めるので取りこぼさない
concurrency:
  group: sync-d1
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 手動の実行は自治体コード（空なら全件）。push は最後に成功した push の同期からの差分
      # （取り消された run・落ちた run の範囲も次の run が拾う）。見つからなければ全件
      - id: scope
        env:
          CODES: ${{ inputs.jurisdictions }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            args=""
            for c in $CODES; do
              [[ "$c" =~ ^[0-9]{6}$ ]] || { echo "not a jurisdiction code: $c"; exit 1; }
              args="$args --jurisdiction $c"
            done
            echo "args=${args:---all}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # API が落ちたら step ごと落とす（全件に倒すより軽い。次の run が最後の成功から拾う）
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/sync-d1.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null && git merge-base --is-ancestor "$last" HEAD; then
            echo "args=--since $last" >> "$GITHUB_OUTPUT"
          else
            echo "args=--all" >> "$GITHUB_OUTPUT"
          fi
      - uses: jdx/mise-action@v5
        with:
          version: 2026.8.6
      - run: bun install --frozen-lockfile
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: |
          for wait in 30 60 0; do
            uv sync --frozen && exit 0
            sleep "$wait"
          done
          exit 1
      # R2 から戻した取り込みの表・出典と、事業の PDF を読んだ結果。毎回新しい key で保存して温めておく
      - uses: actions/cache/restore@v6
        with:
          path: pipeline/.cache
          key: pipeline-cache-${{ hashFiles('mise.toml') }}-${{ github.run_id }}
          restore-keys: pipeline-cache-${{ hashFiles('mise.toml') }}-
      - run: bun run --cwd pipeline publish -- --database-id b9b6f209-083e-45b3-a896-1014a17a15f9 ${{ steps.scope.outputs.args }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - if: always()
        uses: actions/cache/save@v6
        with:
          path: pipeline/.cache
          key: pipeline-cache-${{ hashFiles('mise.toml') }}-${{ github.run_id }}
