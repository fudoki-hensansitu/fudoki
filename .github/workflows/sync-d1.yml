name: sync-d1
# main に入った取り込み・dbt の変更を、marts に build して本番 D1（fudoki-api）へ差分で写す（ADR 0040）。
# publish の前に、取り込みの PR が変えた宣言を main のコードで変換し、保存の関門を通った表と受領書を R2 に置く（ingestion:store、ADR 0051）。
# 範囲は serving/publish.py（bun run --cwd pipeline publish）が差分から決める。取り込みの宣言・選定・自治体の列を持つ seed だけならその自治体だけ、
# 全自治体に効く変更なら全件。事業と評価シートのつなぎは build のたびに計算する。
on:
  push:
    branches: [main]
    paths:
      - pipeline/**
      - packages/jurisdictions/**
      - packages/fiscal/**
      - apps/api/src/columns.json
      - uv.lock
      - pyproject.toml
      - mise.toml
  # 週に1回、写しがあっても D1 を全行読んで比べ、写しと D1 のずれ（手での書き込みなど）を直す（月曜 04:00 JST）
  schedule:
    - cron: '0 19 * * 0'
  workflow_dispatch:
    inputs:
      jurisdictions:
        description: 自治体コード（空白区切り）。空なら全件
        required: false
        default: ''
permissions:
  contents: read
  # actions: write は古い cache を消すため（読むだけなら read で足りる）
  actions: write
# R2 への保存（store）と D1 への同期（sync）は別の job にし、concurrency も分ける。
# store は merge のたびにすぐ流し、前の run の D1 同期（全件だと30分を超える）の後ろに並ばない。
# 後の PR の ingestion-store-check は main の表を R2 から読むので、保存が遅れるとその間 404 で落ちる
jobs:
  store:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # 保存は同時に2つ流さない（同じ表を続けて記録した merge が、古い表で新しい表を上書きしないよう順に流す）
    concurrency:
      group: ingestion-store
      cancel-in-progress: false
    outputs:
      args: ${{ steps.scope.outputs.args }}
      store: ${{ steps.store.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 手動の実行は自治体コード（空なら全件）、週1の照合は全件。push は最後に成功した push の同期からの差分
      # （取り消された run・落ちた run の範囲も次の run が拾う）。見つからなければ全件
      - id: scope
        env:
          CODES: ${{ inputs.jurisdictions }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != push ]; then
            args=""
            for c in $CODES; do
              [[ "$c" =~ ^[0-9]{6}$ ]] || { echo "not a jurisdiction code: $c"; exit 1; }
              args="$args --jurisdiction $c"
            done
            echo "args=${args:---all}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # API が落ちたら step ごと落とす（全件に倒すより軽い。次の run が最後の成功から拾う）
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/sync-d1.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null && git merge-base --is-ancestor "$last" HEAD; then
            echo "args=--since $last" >> "$GITHUB_OUTPUT"
            echo "since=$last" >> "$GITHUB_OUTPUT"
          else
            echo "args=--all" >> "$GITHUB_OUTPUT"
            # R2 に置く表は、成功した同期が無くてもこの push の差分から決める
            echo "since=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.since != ''
        uses: jdx/mise-action@v5
        with:
          version: 2026.8.6
      - if: steps.scope.outputs.since != ''
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - if: steps.scope.outputs.since != ''
        run: |
          for wait in 30 60 0; do
            uv sync --frozen && exit 0
            sleep "$wait"
          done
          exit 1
      # 出典の PDF と build の入力は cache せず、要るものを R2 から取る（変換し直すのは変わった管理 JSON の出典だけ）
      # PDF から読んだ字と位置（変換し直しで一番重い）。中身が増えた回だけ保存し、後の PR の check と refresh-check が読む
      - if: steps.scope.outputs.since != ''
        uses: actions/cache/restore@v6
        with:
          path: pipeline/.cache/generic-observation
          key: generic-observation-${{ hashFiles('mise.toml') }}-${{ github.run_id }}
          restore-keys: generic-observation-${{ hashFiles('mise.toml') }}-
      - id: observation-before
        if: steps.scope.outputs.since != ''
        run: |
          echo "files=$(find pipeline/.cache/generic-observation -type f -printf '%P %s\n' 2>/dev/null | sort | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # 一部の scan の表は mutool で字を読む（generic/patterns/components/clipped_words.py）
      - if: steps.scope.outputs.since != ''
        run: mise install conda:mupdf@1.28.6
      # 手動の実行は R2 に置かない（置くのは merge された宣言の表だけ）。since が古くても、受領書の宣言と指紋が今と同じ表は変換し直さない（store.to_convert）
      # 落ちた管理 JSON があっても、ほかは置き終えてから job を落とす。sync はそれでも流す（下の sync の if）
      - id: store
        if: steps.scope.outputs.since != ''
        run: bun run --cwd pipeline ingestion:store -- --since ${{ steps.scope.outputs.since }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - id: observation-after
        if: ${{ !cancelled() && steps.scope.outputs.since != '' }}
        run: echo "files=$(find pipeline/.cache/generic-observation -type f -printf '%P %s\n' 2>/dev/null | sort | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - id: observation-save
        if: ${{ !cancelled() && steps.scope.outputs.since != '' && steps.observation-after.outputs.files != steps.observation-before.outputs.files }}
        uses: actions/cache/save@v6
        with:
          path: pipeline/.cache/generic-observation
          key: generic-observation-${{ hashFiles('mise.toml') }}-${{ github.run_id }}
      # 古い generic-observation を消す。この job が戻した後に refresh-check などが保存したもの（started より後）は残す
      - if: ${{ !cancelled() && steps.observation-save.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ steps.observation-before.outputs.started }}
          KEEP: generic-observation-${{ hashFiles('mise.toml') }}-${{ github.run_id }}
        run: |
          gh cache list --repo "${{ github.repository }}" --key generic-observation- --ref refs/heads/main --limit 100 --json key,createdAt \
            --jq ".[] | select(.createdAt < \"$STARTED\") | .key" |
            while read -r key; do
              [ "$key" = "$KEEP" ] || gh cache delete "$key" --repo "${{ github.repository }}" || true
            done

  sync:
    needs: store
    # 保存（ingestion:store）が一部の管理 JSON で落ちても、ほかの自治体の同期は止めない。保存されなかった新しい資料は
    # build から外れ（prepare の not_stored）、run は赤いままなので範囲の起点は進まず、直した後の run が拾い直す
    if: ${{ !cancelled() && (needs.store.result == 'success' || needs.store.outputs.store == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # serving:sync は同時に2つ流せない（`<表>__new` が衝突する）。前の同期を止めず、順に流す。
    # 待てる job は1本だけで、それより前の待ちは取り消される。範囲は store job が「最後に成功した run」から決めるので、
    # 待っている間に前の同期が終わっても、範囲が広いだけで取りこぼさない（書くのは D1 との差分だけ）
    concurrency:
      group: sync-d1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          version: 2026.8.6
      - run: bun install --frozen-lockfile
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: |
          for wait in 30 60 0; do
            uv sync --frozen && exit 0
            sleep "$wait"
          done
          exit 1
      # build の入力（受領書の一覧の表・事業評価の読んだ結果と頁の文字）は R2 の束から読む。足りないものは build が1個ずつ取る
      - run: bun run --cwd pipeline ingestion:bundle restore
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # 前回の同期で D1 に入れた表の写し。最新のものを戻し、D1 の印と合うかは sync_d1 が確かめる（合わなければ D1 を読む）
      - uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/d1-snapshot
          key: d1-snapshot-${{ github.run_id }}
          restore-keys: d1-snapshot-
      - id: snapshot-before
        run: echo "sha=$(sha256sum "$RUNNER_TEMP/d1-snapshot/snapshot.duckdb" 2>/dev/null | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - run: >-
          bun run --cwd pipeline publish -- --database-id b9b6f209-083e-45b3-a896-1014a17a15f9 ${{ needs.store.outputs.args }}
          --snapshot "$RUNNER_TEMP/d1-snapshot/snapshot.duckdb" ${{ github.event_name == 'schedule' && '--verify-all' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # 全件の build は 4GB だと int_fiscal__rows で DuckDB の上限に当たる。public repo の runner は 16GB
          FUDOKI_DUCKDB_MEMORY_LIMIT: 12GB
      # build が読んだもの（受領書の一覧の表・事業評価の読んだ結果と頁の文字）を R2 の束にする。中身が同じなら置き直さない。
      # 束は cache が消えたときの戻り道なので、置けなくても同期は失敗にしない
      - run: bun run --cwd pipeline ingestion:bundle save
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # 同期が成功して写しが書き直された回だけ保存し、古い写しは消す
      - id: snapshot-after
        run: echo "sha=$(sha256sum "$RUNNER_TEMP/d1-snapshot/snapshot.duckdb" 2>/dev/null | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - id: snapshot-save
        if: steps.snapshot-after.outputs.sha != '' && steps.snapshot-after.outputs.sha != steps.snapshot-before.outputs.sha
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/d1-snapshot
          key: d1-snapshot-${{ github.run_id }}
      - if: steps.snapshot-save.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: d1-snapshot-${{ github.run_id }}
        run: |
          gh cache list --repo "${{ github.repository }}" --key d1-snapshot- --limit 100 --json key --jq '.[].key' |
            while read -r key; do
              [ "$key" = "$KEEP" ] || gh cache delete "$key" --repo "${{ github.repository }}" || true
            done
      # 使わなくなった cache（build の入力の pipeline-build・pipeline-cache、出典の pipeline-origins）を消す。どれも無くなったら、この step は外してよい
      - if: ${{ !cancelled() && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for prefix in pipeline-build- pipeline-cache- pipeline-origins-; do
            gh cache list --repo "${{ github.repository }}" --key "$prefix" --limit 100 --json key --jq '.[].key' |
              while read -r key; do gh cache delete "$key" --repo "${{ github.repository }}" || true; done
          done
