name: refresh-check
# Compares every stored table whose fingerprint is stale with a fresh conversion (ADR 0051).
# A pull request no longer stops on a stale fingerprint; this run finds a table that a shared-code change altered.
# On main a second, short job rewrites the fingerprints of unchanged tables in the receipts list in R2, so stale
# fingerprints do not pile up (no pull request: the receipts are not in Git). It shares the store's concurrency;
# the long comparison does not. On another branch the run only compares.
# A table that differs is reported; a manual run on main with `accept` stores it as re-converted and syncs
# its jurisdictions to D1 (no Git change brings them to the build).
on:
  schedule:
    # Every day at 18:00 UTC (03:00 JST the next day), so a shared-code change that altered a table
    # shows up the next morning. Daily runs also keep the observation cache (evicted after 7 days without access).
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      all:
        description: Re-read every conversion, not only stale ones (after a Poppler change)
        type: boolean
        default: false
      accept:
        description: Store the tables that differ as re-converted (main only, after reading the last report)
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: refresh-check
  cancel-in-progress: false
jobs:
  refresh:
    name: Saved tables against the current code
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.8.6
      - id: uv-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: |
          for wait in 30 60 0; do
            uv sync --frozen && exit 0
            sleep "$wait"
          done
          exit 1
      # Some scan tables read clipped words with mutool (generic/patterns/components/clipped_words.py).
      - run: mise install conda:mupdf@1.28.6
      # The stored tables to compare with, from the bundle main's sync job keeps in R2 (one read instead of one
      # per table). Whatever it lacks is fetched one by one.
      - run: bun run --cwd pipeline ingestion:bundle restore tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Page words read from the PDFs: the slow part of a cold run. A new key each run keeps the cache fresh.
      # The words depend on the Poppler pinned in mise.toml but are cached without its version
      # (ingestion/lib/poppler.py), so the key carries mise.toml and a Poppler change starts empty.
      - uses: actions/cache/restore@v6
        with:
          path: pipeline/.cache/generic-observation
          key: generic-observation-${{ hashFiles('mise.toml') }}-${{ github.run_id }}
          restore-keys: generic-observation-${{ hashFiles('mise.toml') }}-
      - if: ${{ inputs.accept && github.ref != 'refs/heads/main' }}
        run: echo 'accept は main でだけ使える' && exit 1
      - id: refresh
        run: bun run --cwd pipeline ingestion:refresh --remote ${{ github.ref != 'refs/heads/main' && '--dry-run' || '--defer-write' }} ${{ inputs.all && '--all' || '' }} ${{ inputs.accept && '--accept' || '' }} --output "$RUNNER_TEMP/refresh/report.json"
        env:
          # Reads R2; an accepted table is uploaded at its content-sha key (no stored table is overwritten).
          # The receipts are written by the write job below.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - if: always()
        uses: actions/cache/save@v6
        with:
          path: pipeline/.cache/generic-observation
          key: generic-observation-${{ hashFiles('mise.toml') }}-${{ github.run_id }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: refresh-report
          path: ${{ runner.temp }}/refresh/report.json
          if-no-files-found: ignore
      - if: always()
        name: 結果を表示
        run: |
          report="$RUNNER_TEMP/refresh/report.json"
          if [ ! -f "$report" ]; then echo 'report がありません（refresh が途中で止まった）' >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          python3 - "$report" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          statuses = {}
          for item in report['manifests']:
              statuses[item['status']] = statuses.get(item['status'], 0) + 1
          print(f"管理JSON {len(report['manifests'])} 件・{report['jobs']} 並列・{report['elapsed_seconds']} 秒: {statuses}")
          print(f"受領書: {report.get('receipts')}")
          print()
          for item in report['manifests']:
              if item['status'] in ('different', 'blocked', 'error'):
                  print(f"- `{item['manifest']}`: {item['status']} {item.get('reason', '')[:200]}")
                  for table in item.get('tables', []):
                      if table.get('status') != 'same':
                          content = table.get('diff', {}).get('content', {})
                          rows = {kind: {key: part.get(key) for key in ('removed', 'added', 'changed')}
                                  for kind, part in content.items() if not part.get('same', True)}
                          receipt = [entry.get('field') for entry in table.get('diff', {}).get('receipt', [])]
                          print(f"  - `{table['table_id']}`: {table.get('status')} rows={rows} receipt={receipt}")
          PY
  write:
    name: Receipts of the refreshed tables
    needs: refresh
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The receipts list is written by one job at a time (sync-d1's store shares this group).
    concurrency:
      group: ingestion-store
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.8.6
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: |
          for wait in 30 60 0; do
            uv sync --frozen && exit 0
            sleep "$wait"
          done
          exit 1
      - id: download
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: refresh-report
          path: ${{ runner.temp }}/refresh
      - id: apply
        if: steps.download.outcome == 'success'
        run: |
          result=$(bun run --cwd pipeline ingestion:refresh --apply "$RUNNER_TEMP/refresh/report.json")
          echo "$result"
          echo "受領書: $result" >> "$GITHUB_STEP_SUMMARY"
          echo "jurisdictions=$(echo "$result" | jq -r '.accepted_jurisdictions | join(" ")')" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - if: steps.apply.outputs.jurisdictions != ''
        name: 置き直した自治体を D1 へ同期する
        env:
          GH_TOKEN: ${{ github.token }}
          CODES: ${{ steps.apply.outputs.jurisdictions }}
        run: gh workflow run sync-d1.yml --ref main -f jurisdictions="$CODES"
