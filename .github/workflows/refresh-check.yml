name: refresh-check
# Compares every saved table whose fingerprint is stale with a fresh conversion (ADR 0027, revised 2026-11-12).
# A pull request no longer stops on a stale fingerprint; this run finds a table that a shared-code change altered.
on:
  schedule:
    # Every day at 18:00 UTC (03:00 JST the next day), so a shared-code change that altered a table
    # shows up the next morning. Daily runs also keep the observation cache (evicted after 7 days without access).
    - cron: '0 18 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: refresh-check
  cancel-in-progress: false
jobs:
  refresh:
    name: Saved tables against the current code (dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.8.6
      - id: uv-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: |
          for wait in 30 60 0; do
            uv sync --frozen && exit 0
            sleep "$wait"
          done
          exit 1
      # Some scan tables read clipped words with mutool (generic/patterns/components/clipped_words.py).
      - run: mise install conda:mupdf@1.28.6
      # Page words read from the PDFs: the slow part of a cold run. A new key each run keeps the cache fresh.
      # The words depend on the Poppler pinned in mise.toml but are cached without its version
      # (ingestion/lib/poppler.py), so the key carries mise.toml and a Poppler change starts empty.
      - uses: actions/cache/restore@v6
        with:
          path: pipeline/.cache/generic-observation
          key: generic-observation-${{ hashFiles('mise.toml') }}-${{ github.run_id }}
          restore-keys: generic-observation-${{ hashFiles('mise.toml') }}-
      - id: refresh
        run: bun run --cwd pipeline ingestion:refresh --remote --dry-run --output "$RUNNER_TEMP/refresh/report.json"
        env:
          # The deploy token also reads the private input bucket (R2 read only); --dry-run never writes R2.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - if: always()
        uses: actions/cache/save@v6
        with:
          path: pipeline/.cache/generic-observation
          key: generic-observation-${{ hashFiles('mise.toml') }}-${{ github.run_id }}
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: refresh-report
          path: ${{ runner.temp }}/refresh/report.json
          if-no-files-found: ignore
      - if: always()
        name: 結果を表示
        run: |
          report="$RUNNER_TEMP/refresh/report.json"
          if [ ! -f "$report" ]; then echo 'report がありません（refresh が途中で止まった）' >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          python3 - "$report" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          statuses = {}
          for item in report['manifests']:
              statuses[item['status']] = statuses.get(item['status'], 0) + 1
          print(f"管理JSON {len(report['manifests'])} 件・{report['jobs']} 並列・{report['elapsed_seconds']} 秒: {statuses}")
          print()
          for item in report['manifests']:
              if item['status'] in ('different', 'blocked', 'error'):
                  print(f"- `{item['manifest']}`: {item['status']} {item.get('reason', '')[:200]}")
                  for table in item.get('tables', []):
                      if table.get('status') != 'same':
                          content = table.get('diff', {}).get('content', {})
                          rows = {kind: {key: part.get(key) for key in ('removed', 'added', 'changed')}
                                  for kind, part in content.items() if not part.get('same', True)}
                          receipt = [entry.get('field') for entry in table.get('diff', {}).get('receipt', [])]
                          print(f"  - `{table['table_id']}`: {table.get('status')} rows={rows} receipt={receipt}")
          PY
