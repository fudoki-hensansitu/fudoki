name: verify-pipeline
# pipeline の型検査・repo の決まりの検査・unit テストと、選定・管理 JSON の検査。実データ（R2）は読まない
on:
  pull_request:
    paths:
      - pipeline/**
      - packages/**
      # 列の契約（serving/columns_test.py）が読む
      - apps/api/src/columns.json
      - docs/adr/**
      - package.json
      - bun.lock
      - bunfig.toml
      - mise.toml
      - tsconfig.json
      - pyproject.toml
      - uv.lock
      - .github/workflows/verify-pipeline.yml
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.8.6
      - run: bun install --frozen-lockfile
      # dbt-core-experimental-parser has only an sdist whose build downloads a binary from GitHub Releases, which often fails with 5xx.
      - id: uv-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      # The cache is empty on the first run, so retry with waits longer than the build's own retries.
      - id: uv-sync
        run: |
          for wait in 30 60 0; do
            uv sync --frozen && exit 0
            sleep "$wait"
          done
          exit 1
      # root の tsc は pipeline と packages を見る
      - run: bun run typecheck
      - run: bun run --cwd pipeline lint
      - run: bun run --cwd pipeline test
      # Saves even when later checks fail, so a failing test does not keep the cache empty.
      # Keeps only wheels built from sdists, which are the ones that need the cache.
      - if: always() && steps.uv-sync.outcome == 'success' && steps.uv-cache.outputs.cache-hit != 'true'
        run: uv cache prune --ci
      - if: always() && steps.uv-sync.outcome == 'success' && steps.uv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/uv
          key: ${{ steps.uv-cache.outputs.cache-primary-key }}
