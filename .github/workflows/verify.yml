name: verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture-and-code:
    name: Synthetic fixture and code (not full fiscal build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.8.6
      - run: bun install --frozen-lockfile
      # dbt-core-experimental-parser has only an sdist whose build downloads a binary from GitHub Releases, which often fails with 5xx.
      - id: uv-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      # The cache is empty on the first run, so retry with waits longer than the build's own retries.
      - id: uv-sync
        run: |
          for wait in 30 60 0; do
            uv sync --frozen && exit 0
            sleep "$wait"
          done
          exit 1
      - run: bun run typecheck:all
      - run: bun run lint
      - run: bun run test
      # Saves even when later checks fail, so a failing test does not keep the cache empty.
      # Keeps only wheels built from sdists, which are the ones that need the cache.
      - if: always() && steps.uv-sync.outcome == 'success' && steps.uv-cache.outputs.cache-hit != 'true'
        run: uv cache prune --ci
      - if: always() && steps.uv-sync.outcome == 'success' && steps.uv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/uv
          key: ${{ steps.uv-cache.outputs.cache-primary-key }}
      - name: 検証範囲を表示
        run: echo '架空自治体の fixture とコードの検証。' >> "$GITHUB_STEP_SUMMARY"
