name: verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture-and-code:
    name: Synthetic fixture and code (not full fiscal build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.8.6
      - run: bun install --frozen-lockfile
      # dbt-core-experimental-parser has only an sdist whose build downloads a binary from GitHub Releases, which often fails with 5xx.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      # The cache is empty on the first run, so retry with waits longer than the build's own retries.
      - run: |
          for wait in 30 60 0; do
            uv sync --frozen && exit 0
            sleep "$wait"
          done
          exit 1
      - run: bun run typecheck:all
      - run: bun run test
      - run: bun pipeline/source_selection/check.ts
      - run: bun run --cwd pipeline ingestion:check
      - run: bun run --cwd pipeline test:python
      - run: bun run --cwd pipeline serving:evaluation-catalog --check
      - run: bun run --cwd apps/web build:font:check
      - run: bun run build:web
      - run: bun run build:api
      - run: bun run build:docs
      - run: bun run pipeline/verify/boundaries.ts
      - run: bun run pipeline/verify/python.ts
      - run: bun run pipeline/verify/docs.ts
      # Keeps only wheels built from sdists, which are the ones that need the cache.
      - if: always()
        run: uv cache prune --ci
      - name: 検証範囲を表示
        run: echo '架空自治体の fixture とコードの検証。' >> "$GITHUB_STEP_SUMMARY"
