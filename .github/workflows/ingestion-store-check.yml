name: ingestion-store-check
# 取り込みの PR が変えた管理 JSON の宣言を、R2 にある出典・OCR 結果から main のコードで変換し、保存の関門を通す（ADR 0051）。
# 通った表の受領書（pending-receipts.json）を R2 の受領書の一覧に重ね、表は手元の cache に置いて、
# 管理 JSON を変えた自治体だけ dbt を build する（D1 は読まない）。宣言の欠けや読み違いで dbt の検査が落ちるのも、
# ここで merge 前に止める。R2 は読むだけ。merge 後の sync-d1 の store が同じ変換を R2 に置く。
on:
  pull_request:
    paths:
      - pipeline/ingestion/fiscal/jurisdictions/**/*.json
permissions:
  contents: read
concurrency:
  group: ingestion-store-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    # fork の PR には secret が渡らない。同じ repo の branch を push できる人は、PR の workflow を書き換えて
    # この secret（R2 の書き込みを持つ）を使えるので、この check を足しても渡る範囲は変わらない（ADR 0045）
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          version: 2026.8.6
      - run: bun install --frozen-lockfile
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: |
          for wait in 30 60 0; do
            uv sync --frozen && exit 0
            sleep "$wait"
          done
          exit 1
      - run: mise install conda:mupdf@1.28.6
      # build の入力は R2 の束（main の sync job が置く）から読む。足りない表は build が1個ずつ取る
      - run: bun run --cwd pipeline ingestion:bundle restore
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # PDF から読んだ字と位置（変換し直しで一番重い）。main の store と refresh-check が温める。
      # 中身が増えたらこの PR の範囲に保存し、同じ PR への次の push はそこから読む
      - uses: actions/cache/restore@v6
        with:
          path: pipeline/.cache/generic-observation
          key: generic-observation-${{ hashFiles('mise.toml') }}-${{ github.run_id }}
          restore-keys: generic-observation-${{ hashFiles('mise.toml') }}-
      - id: observation-before
        run: echo "files=$(find pipeline/.cache/generic-observation -type f -printf '%P %s\n' 2>/dev/null | sort | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - id: base
        run: echo "sha=$(git merge-base origin/${{ github.base_ref }} HEAD)" >> "$GITHUB_OUTPUT"
      - run: bun run --cwd pipeline ingestion:store -- --dry-run --since ${{ steps.base.outputs.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # 照合が落ちても読んだ字は正しいので保存する（直して push した次の run が使う）。
      # 取り消し・時間切れの回は書きかけのファイルがありうるので保存しない
      - id: observation-after
        if: ${{ !cancelled() }}
        run: echo "files=$(find pipeline/.cache/generic-observation -type f -printf '%P %s\n' 2>/dev/null | sort | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() && steps.observation-after.outputs.files != steps.observation-before.outputs.files }}
        uses: actions/cache/save@v6
        with:
          path: pipeline/.cache/generic-observation
          key: generic-observation-${{ hashFiles('mise.toml') }}-${{ github.run_id }}
      # PR の表はまだ R2 に無いので、上で関門を通して cache に置いた表と、その受領書から build する。
      # build するのは管理 JSON を変えた自治体だけ（PR で新しくできるのはその表だけ）。共通の変更が他の自治体に
      # 与える影響は、変換は refresh-check、dbt は merge 後の sync-d1 が見る。D1 は指定しない（書く行数は sync-d1 が出す）
      - id: changed
        run: |
          codes=$(git diff --name-only ${{ steps.base.outputs.sha }} HEAD -- pipeline/ingestion/fiscal/jurisdictions \
            | sed -nE 's#^pipeline/ingestion/fiscal/jurisdictions/([0-9]{6})/[0-9]{4}/.+\.json$#\1#p' | sort -u)
          echo "args=$(for c in $codes; do printf -- '--jurisdiction %s ' "$c"; done)" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.args != ''
        run: bun run --cwd pipeline publish -- --dry-run ${{ steps.changed.outputs.args }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          INGESTION_PENDING_RECEIPTS: ${{ github.workspace }}/pipeline/.build/pending-receipts.json
          FUDOKI_DUCKDB_MEMORY_LIMIT: 12GB
