name: ingestion-store-check
# 取り込みの PR が管理 JSON に記録した表を、R2 にある出典・OCR 結果から変換し直し、記録と一致するかを見る（ADR 0045）。
# merge 後の sync-d1 が同じ変換をして R2 に置くので、食い違いはここで merge 前に止める。R2 は読むだけ。
on:
  pull_request:
    paths:
      - pipeline/ingestion/fiscal/jurisdictions/**/*.json
permissions:
  contents: read
concurrency:
  group: ingestion-store-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    # fork の PR には secret が渡らない。同じ repo の branch を push できる人は、PR の workflow を書き換えて
    # この secret（R2 の書き込みを持つ）を使えるので、この check を足しても渡る範囲は変わらない（ADR 0045）
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          version: 2026.8.6
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: |
          for wait in 30 60 0; do
            uv sync --frozen && exit 0
            sleep "$wait"
          done
          exit 1
      - run: mise install conda:mupdf@1.28.6
      - uses: actions/cache/restore@v6
        with:
          path: pipeline/.cache/generic-observation
          key: generic-observation-${{ hashFiles('mise.toml') }}-${{ github.run_id }}
          restore-keys: generic-observation-${{ hashFiles('mise.toml') }}-
      - run: bun run --cwd pipeline ingestion:store -- --dry-run --since "$(git merge-base origin/${{ github.base_ref }} HEAD)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
