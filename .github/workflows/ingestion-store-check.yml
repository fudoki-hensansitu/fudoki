name: ingestion-store-check
# 取り込みの PR が管理 JSON に記録した表を、R2 にある出典・OCR 結果から変換し直し、記録と一致するかを見る（ADR 0045）。
# 一致した表を手元の cache に置き、merge 後の sync-d1 と同じ範囲で dbt を build する（D1 は読まない）。
# 変換の食い違いも、宣言の欠けや読み違いで dbt の検査が落ちるのも、ここで merge 前に止める。R2 は読むだけ。
on:
  pull_request:
    paths:
      - pipeline/ingestion/fiscal/jurisdictions/**/*.json
permissions:
  contents: read
concurrency:
  group: ingestion-store-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    # fork の PR には secret が渡らない。同じ repo の branch を push できる人は、PR の workflow を書き換えて
    # この secret（R2 の書き込みを持つ）を使えるので、この check を足しても渡る範囲は変わらない（ADR 0045）
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          version: 2026.8.6
      - run: bun install --frozen-lockfile
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: |
          for wait in 30 60 0; do
            uv sync --frozen && exit 0
            sleep "$wait"
          done
          exit 1
      - run: mise install conda:mupdf@1.28.6
      # sync-d1 が main で温めた cache（R2 から戻した表・出典、事業の PDF を読んだ結果）を読むだけ。PR からは保存しない
      - uses: actions/cache/restore@v6
        with:
          path: pipeline/.cache
          key: pipeline-cache-${{ hashFiles('mise.toml') }}-${{ github.run_id }}
          restore-keys: pipeline-cache-${{ hashFiles('mise.toml') }}-
      # PDF から読んだ字と位置（変換し直しで一番重い）。main の store と refresh-check が温める。
      # 中身が増えたらこの PR の範囲に保存し、同じ PR への次の push はそこから読む
      - uses: actions/cache/restore@v6
        with:
          path: pipeline/.cache/generic-observation
          key: generic-observation-${{ hashFiles('mise.toml') }}-${{ github.run_id }}
          restore-keys: generic-observation-${{ hashFiles('mise.toml') }}-
      - id: observation-before
        run: echo "files=$(find pipeline/.cache/generic-observation -type f -printf '%P %s\n' 2>/dev/null | sort | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - id: base
        run: echo "sha=$(git merge-base origin/${{ github.base_ref }} HEAD)" >> "$GITHUB_OUTPUT"
      - run: bun run --cwd pipeline ingestion:store -- --dry-run --since ${{ steps.base.outputs.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # 照合が落ちても読んだ字は正しいので保存する（直して push した次の run が使う）
      - id: observation-after
        if: always()
        run: echo "files=$(find pipeline/.cache/generic-observation -type f -printf '%P %s\n' 2>/dev/null | sort | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - if: always() && steps.observation-after.outputs.files != steps.observation-before.outputs.files
        uses: actions/cache/save@v6
        with:
          path: pipeline/.cache/generic-observation
          key: generic-observation-${{ hashFiles('mise.toml') }}-${{ github.run_id }}
      # PR の表はまだ R2 に無いので、上で一致を確かめて cache に置いた表から build する。
      # D1 は指定しない（全件の範囲だと D1 を全行読んで30分を超える。書く行数は merge 後の sync-d1 が出す）
      - run: bun run --cwd pipeline publish -- --dry-run --since ${{ steps.base.outputs.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
