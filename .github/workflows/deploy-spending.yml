name: deploy-spending
# main に入った spending（spending.fudoki.dev、apps/samples/spending）の変更をデプロイする。
# データは本体の Worker（fudoki）を Service Binding で読むだけなので、web の deploy を待たない
on:
  push:
    branches: [main]
    paths:
      - apps/samples/spending/**
      - packages/**
      - package.json
      - bun.lock
      - bunfig.toml
      - mise.toml
      - tsconfig.json
      - .github/workflows/deploy-spending.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-spending
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.8.6
      - run: bun install --frozen-lockfile
      - run: bun run deploy:spending
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
