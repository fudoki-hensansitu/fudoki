version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # 1回の更新で lock を1つの PR にまとめる。package ごとに PR を分けると、1つ merge するたびに
    # 残りの PR の lock がずれて rebase 待ちになり、同じ系列の package（ai と @ai-sdk/*）が
    # 別の PR に分かれて版が噛み合わなくなる。major は破壊的変更を個別に見るため分ける。
    groups:
      bun:
        update-types: [minor, patch]
    ignore:
      # void 1.5.0 は build で wrangler の設定を Cloudflare の新しい形に移すが、fudoki.dev の route
      # （custom_domain に previews_enabled を付けて pr-<番号>.fudoki.dev の preview を出す）を移せずに止まる。
      # 移せる版が出るまで 1.3.0 に留める
      - dependency-name: 'void'
        versions: ['>=1.5.0']
      - dependency-name: '@void/react'
        versions: ['>=1.5.0']
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # bun と同じ理由で minor・patch を1つの PR にまとめる
    groups:
      uv:
        update-types: [minor, patch]
    ignore:
      # root の workspace member は PyPI に無い。uv は [tool.uv.sources] で解決するが、
      # Dependabot はその source を解釈せずレジストリ参照で失敗するので対象外にする。
      - dependency-name: 'fudoki-pipeline*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # bun と同じ理由で minor・patch を1つの PR にまとめる
    groups:
      github-actions:
        update-types: [minor, patch]
