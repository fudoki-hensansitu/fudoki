version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # root の workspace member は PyPI に無い。uv は [tool.uv.sources] で解決するが、
      # Dependabot はその source を解釈せずレジストリ参照で失敗するので対象外にする。
      - dependency-name: 'fudoki-pipeline*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
