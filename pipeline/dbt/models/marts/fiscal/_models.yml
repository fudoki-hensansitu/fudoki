- name: origin
  description: 原典選定から毎回生成する原典ファイルの表。独立した証跡ファイルを保存するものではない。
  columns:
  - name: origin_id
    data_tests:
    - unique
    - not_null
  - name: sha256
    data_tests:
    - not_null
  - name: jurisdiction_code
    data_tests:
    - not_null
