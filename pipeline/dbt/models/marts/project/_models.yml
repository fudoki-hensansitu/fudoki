version: 2
models:
- name: project_origin
  description: 事業についての資料（事業評価の評価シート・評価の結果、予算案のプレス発表）の出典。PDF 1つが1行。
  columns:
  - name: origin_id
    description: 出典の識別子。PDF の sha256。
    data_tests: [not_null, unique]
  - name: jurisdiction_code
    description: 全国地方公共団体コード（6桁）。jurisdiction の jurisdiction_code。
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('jurisdiction')
          field: jurisdiction_code
  - name: document_type
    description: 資料の種類。sheets（事務事業評価シート）・result（事務事業評価の結果）・press（予算案のプレス発表）。
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['sheets', 'result', 'press']
  - name: fiscal_year
    description: 会計年度（西暦）。sheets と result は評価した事業を実施した年度、press は予算の年度。
    data_tests: [not_null]
  - name: title
    description: 資料の名前。
  - name: url
    description: 資料（PDF）の URL。
    data_tests: [not_null]
  - name: landing_url
    description: 資料を載せた自治体のページの URL。
  - name: sha256
    description: 読んだ PDF の sha256。
    data_tests: [not_null]
- name: project_evaluation_sheet
  description: 事務事業評価シート。1枚（1小事業）が1行。金額は出典の千円を円にしたもの。文章の欄（目的・取組・課題）は持たない。
  columns:
  - name: sheet_id
    description: 行の ID。origin_id と頁から作る（sha256）。
    data_tests: [not_null, unique]
  - name: origin_id
    description: 出典。project_origin の origin_id。
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('project_origin')
          field: origin_id
  - name: jurisdiction_code
    description: 全国地方公共団体コード（6桁）。
    data_tests: [not_null]
  - name: fiscal_year
    description: 評価した事業を実施した会計年度（西暦）。
    data_tests: [not_null]
  - name: evaluation_year
    description: 評価した年度（西暦）。シートの題の年度で、実施した年度の翌年度。
    data_tests: [not_null]
  - name: page
    description: 出典の PDF の頁（1始まり、印字の頁番号ではない）。
    data_tests: [not_null]
  - name: name
    description: シートの小事業名。
    data_tests: [not_null]
  - name: account_name
    description: シートの予算科目の会計。
  - name: kan_name
    description: シートの予算科目の款。
  - name: kou_name
    description: シートの予算科目の項。
  - name: moku_name
    description: シートの予算科目の目。
  - name: jigyo_name
    description: シートの予算科目の事業。
  - name: department
    description: シートの担当部署。
  - name: division
    description: シートの担当課。
  - name: period_start_year
    description: シートの事業期間の始まりの年度（西暦）。印字が無ければ空。
  - name: period_end_year
    description: シートの事業期間の終わりの年度（西暦）。印字が無ければ空。
  - name: budget_yen
    description: シートの予算・決算（概要）の計の予算現額（円）。
  - name: settled_yen
    description: シートの予算・決算（概要）の計の決算額（円）。
  - name: cost_previous_yen
    description: シートの行政コスト計算書の行政費用の小計（D）の前年度の額（円）。
  - name: cost_current_yen
    description: シートの行政コスト計算書の行政費用の小計（D）の実施年度の額（円）。
  - name: grade_code
    description: 最終評価の区分の記号（A〜D）。
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['A', 'B', 'C', 'D']
  - name: grade_label
    description: 最終評価の区分の名前（シートの表記、例「改善・見直しする事業」）。
  - name: direction
    description: 最終評価の今後の取組の方向性（シートの表記、例「手法等の改善」）。
  - name: subject_id
    description: 風土記の判断。シートの予算科目（会計・款・項・目の名前）が1つに当たる、同じ年度の決算書の目。fiscal_expenditure_subject の subject_id。当たらなければ空。
    data_tests:
    - relationships:
        arguments:
          to: ref('fiscal_expenditure_subject')
          field: subject_id
  - name: detail_id
    description: 風土記の判断。subject_id の目の下で、シートの予算科目の事業と同じ名前（内訳の末尾の【所管課】以降を除く）の内訳（分け方が事業）が1つだけあるときの、その内訳。fiscal_expenditure_detail の detail_id。1つの内訳に複数の小事業（シート）が入ることがあり、そのときシートの決算額は内訳の額より小さい。
    data_tests:
    - relationships:
        arguments:
          to: ref('fiscal_expenditure_detail')
          field: detail_id
  - name: cofog_code
    description: 風土記の判断。subject_id の目に付けた COFOG コード（fiscal_expenditure_subject の cofog_code の写し）。
  - name: is_new_project
    description: 風土記の判断。実施年度に新しくできた事業の印。事業期間が実施年度から始まり、前年度の行政費用が0で、前年度までの指標の実績が無いもの。
    data_tests: [not_null]
- name: project_evaluation_indicator
  description: 評価シートの指標。シートに印字された順に1つが1行。
  columns:
  - name: indicator_id
    description: 行の ID。シートと指標の順から作る（sha256）。
    data_tests: [not_null, unique]
  - name: sheet_id
    description: project_evaluation_sheet の sheet_id。
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('project_evaluation_sheet')
          field: sheet_id
  - name: position
    description: シートの中での順（1始まり）。
    data_tests: [not_null]
  - name: name
    description: 指標名。
  - name: unit
    description: 単位（シートの表記）。
  - name: definition
    description: 指標の定義（シートの表記）。
  - name: final_target_text
    description: 目標（達成年度）の欄の値（シートの表記のまま）。
  - name: final_target_year_text
    description: 目標の達成年度（シートの表記のまま、例「令和8年度」）。
- name: project_evaluation_indicator_value
  description: 指標の年度ごとの目標と実績。値はシートの表記のまま（文字列）。
  columns:
  - name: value_id
    description: 行の ID。指標と年度から作る（sha256）。
    data_tests: [not_null, unique]
  - name: indicator_id
    description: project_evaluation_indicator の indicator_id。
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('project_evaluation_indicator')
          field: indicator_id
  - name: fiscal_year
    description: 会計年度（西暦）。
    data_tests: [not_null]
  - name: target_text
    description: その年度の目標（シートの表記のまま）。
  - name: actual_text
    description: その年度の実績（シートの表記のまま）。
- name: project_evaluation_result
  description: 事務事業評価の結果。資料1つ（1回の評価）が1行。金額は出典の千円を円にしたもの。
  columns:
  - name: origin_id
    description: 出典。project_origin の origin_id。
    data_tests:
    - not_null
    - unique
    - relationships:
        arguments:
          to: ref('project_origin')
          field: origin_id
  - name: jurisdiction_code
    description: 全国地方公共団体コード（6桁）。
    data_tests: [not_null]
  - name: evaluated_year
    description: 評価した事業を実施した会計年度（西暦）。
    data_tests: [not_null]
  - name: budget_year
    description: 評価を反映した予算の会計年度（西暦）。
    data_tests: [not_null]
  - name: page
    description: 合計の行を読んだ出典の PDF の頁。
  - name: evaluated_count
    description: 評価した事業の数。
  - name: grade_a
    description: A 評価の事業の数。
  - name: grade_b
    description: B 評価の事業の数。
  - name: grade_c
    description: C 評価の事業の数。
  - name: grade_d
    description: D 評価の事業の数。
  - name: reduced_yen
    description: 評価で見直した予算の削減額の合計（円）。
  - name: sheets_origin_id
    description: 同じ評価の評価シートの出典（project_origin の origin_id）。読んでいなければ空。
- name: project_budget_initiative
  description: 予算案に載った施策。品川は予算案のプレス発表の1頁（1施策）が1行。金額は出典の千円を円にしたもの。背景・目的と事業概要の文章は持たない。
  columns:
  - name: initiative_id
    description: 行の ID。origin_id と頁から作る（sha256）。
    data_tests: [not_null, unique]
  - name: origin_id
    description: 出典。project_origin の origin_id。
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('project_origin')
          field: origin_id
  - name: jurisdiction_code
    description: 全国地方公共団体コード（6桁）。
    data_tests: [not_null]
  - name: fiscal_year
    description: 予算の会計年度（西暦）。
    data_tests: [not_null]
  - name: page
    description: 出典の PDF の頁（1始まり）。
    data_tests: [not_null]
  - name: title
    description: 頁の見出し（副題を含む、資料の表記）。
  - name: names
    description: 事業名の欄（JSON の文字列の配列。複数のことがある）。
  - name: is_new
    description: 事業名に「新規」の印がある。
  - name: budget_yen
    description: 予算額（円）。事業名が複数なら合計。
  - name: points
    description: POINT の箇条書き（JSON の文字列の配列、資料の表記）。
  - name: detail_id
    description: 風土記の判断。施策を紐付けた、同じ年度の当初予算書の内訳（fiscal_expenditure_detail の detail_id）。紐付かなければ空。
    data_tests:
    - relationships:
        arguments:
          to: ref('fiscal_expenditure_detail')
          field: detail_id
  - name: link_method
    description: 風土記の判断。紐付けの方法。name（名前と額で直接当たった）・jev（候補12件から TypeSafe の Jev が確信度 0.6 以上で選んだ）・none（紐付かない）。
    data_tests: [not_null]
  - name: link_confidence
    description: 風土記の判断。link_method が jev のときの Jev の確信度。
  - name: cofog_code
    description: 風土記の判断。detail_id の内訳が属する目の COFOG コード。紐付かなければ空（分野は「その他」）。
