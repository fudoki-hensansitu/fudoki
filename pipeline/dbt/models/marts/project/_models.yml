version: 2
models:
- name: project
  description: 事業。予算書・決算書の事業の行（内訳の分け方が「事業」の行）を、年度をまたいでつないだもの。つなぎ方は**風土記の判断**（規則は ingestion/project/link_projects.py、dbt の int_project__line_ids が build のたびに当てる）。内訳の分け方を「事業」と宣言した自治体はすべて対象。
  columns:
  - name: project_id
    description: 事業の ID（代理キー）。事業の最初の年度の行の、年度と資料区分を除いた鍵（自治体・会計・款・項・目・名前の並び）の sha256。前の年度を足しても、つながった年度の行が同じ科目・名前なら変わらない。同じ鍵の別の事業は始めた年度を足して分ける。
    data_tests: [not_null, unique]
  - name: jurisdiction_code
    description: 全国地方公共団体コード（6桁）。
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('jurisdiction')
          field: jurisdiction_code
  - name: first_year
    description: 事業の行がある最初の会計年度（西暦）。
    data_tests: [not_null]
  - name: first_year_kind
    description: confirmed（前の年度の資料があり、そこに無かった）か before_coverage（前の年度の資料が無く、それより前は分からない）。
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['confirmed', 'before_coverage']
  - name: last_year
    description: 事業の行がある最後の会計年度（西暦）。last_year_kind が latest のときは NULL。
  - name: last_year_kind
    description: confirmed（次の年度の資料があり、そこに無かった）・latest（収録の最新の年度にある）・unknown（次の年度の資料がその会計に無い）。
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['confirmed', 'latest', 'unknown']
  - name: parent_project_id
    description: 予算書の入れ子の1つ上の事業（最新の年度の行で決める）。目の直下の事業は NULL。
    data_tests:
    - relationships:
        arguments:
          to: ref('project')
          field: project_id
- name: project_year
  description: 事業の1年度。その年度の当初予算と決算の事業の行（少なくとも一方）を指す。名前・款項目・科目・金額は指した行（expenditure_detail）にあり、ここには写さない。子の事業の額は親の事業の額に含まれるので、事業どうしを足さない。
  columns:
  - name: project_year_id
    description: 事業の ID と年度から作る ID（sha256）。
    data_tests: [not_null, unique]
  - name: project_id
    description: 事業。project の project_id。
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('project')
          field: project_id
  - name: fiscal_year
    description: 会計年度（西暦）。
    data_tests: [not_null]
  - name: initial_expenditure_detail_id
    description: 当初予算書の事業の行。expenditure_detail の detail_id。当初予算に無い年度は NULL。
    data_tests:
    - unique
    - relationships:
        arguments:
          to: ref('expenditure_detail')
          field: detail_id
  - name: settlement_expenditure_detail_id
    description: 決算書の事業の行。expenditure_detail の detail_id。決算に無い年度は NULL。
    data_tests:
    - unique
    - relationships:
        arguments:
          to: ref('expenditure_detail')
          field: detail_id
