version: 2
models:
- name: evaluation_origin
  description: 事業評価の資料（評価シート・評価の結果）の出典。PDF 1つが1行。
  columns:
  - name: origin_id
    description: 出典の識別子。PDF の sha256。
    data_tests: [not_null, unique]
  - name: evaluation_id
    description: 事業評価の根。evaluation の evaluation_id。
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('evaluation')
          field: evaluation_id
  - name: jurisdiction_code
    description: 全国地方公共団体コード（6桁）。jurisdiction の jurisdiction_code。
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('jurisdiction')
          field: jurisdiction_code
  - name: document_type
    description: 資料の種類。sheets（事務事業評価シート）・result（事務事業評価の結果）。
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['sheets', 'result']
  - name: fiscal_year
    description: 評価した事業を実施した会計年度（西暦）。
    data_tests: [not_null]
  - name: title
    description: 資料の名前。
  - name: url
    description: 資料（PDF）の URL。
    data_tests: [not_null]
  - name: landing_url
    description: 資料を載せた自治体のページの URL。
  - name: sha256
    description: 読んだ PDF の sha256。
    data_tests: [not_null]
- name: evaluation_sheet
  description: 事務事業評価シート。1枚（1小事業）が1行。金額は出典の千円を円にしたもの。文章の欄（目的・取組・課題）は持たない。
  columns:
  - name: sheet_id
    description: 行の ID。origin_id と頁から作る（sha256）。
    data_tests: [not_null, unique]
  - name: evaluation_id
    description: 事業評価の根。evaluation の evaluation_id。
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('evaluation')
          field: evaluation_id
  - name: origin_id
    description: 出典。evaluation_origin の origin_id。
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('evaluation_origin')
          field: origin_id
  - name: jurisdiction_code
    description: 全国地方公共団体コード（6桁）。
    data_tests: [not_null]
  - name: fiscal_year
    description: 評価した事業を実施した会計年度（西暦）。
    data_tests: [not_null]
  - name: page
    description: 出典の PDF の頁（1始まり、印字の頁番号ではない）。
    data_tests: [not_null]
  - name: name
    description: シートの小事業名。
    data_tests: [not_null]
  - name: account_name
    description: シートの予算科目の会計。
  - name: kan_name
    description: シートの予算科目の款。
  - name: kou_name
    description: シートの予算科目の項。
  - name: moku_name
    description: シートの予算科目の目。
  - name: jigyo_name
    description: シートの予算科目の事業。
  - name: department
    description: シートの担当部署。
  - name: division
    description: シートの担当課。
  - name: budget_yen
    description: シートの予算・決算（概要）の計の予算現額（円）。
  - name: settled_yen
    description: シートの予算・決算（概要）の計の決算額（円）。
  - name: grade_code
    description: 最終評価の区分の記号（A〜D）。
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['A', 'B', 'C', 'D']
  - name: grade_label
    description: 最終評価の区分の名前（シートの表記、例「改善・見直しする事業」）。
  - name: direction
    description: 最終評価の今後の取組の方向性（シートの表記、例「手法等の改善」）。
  - name: subject_id
    description: 風土記の判断。シートの予算科目（会計・款・項・目の名前）が1つに当たる、同じ年度の決算書の目。fiscal_expenditure_subject の subject_id。当たらなければ空。
    data_tests:
    - relationships:
        arguments:
          to: ref('expenditure_subject')
          field: subject_id
  - name: detail_id
    description: 風土記の判断。subject_id の目の下で、シートの予算科目の事業と同じ名前（内訳の末尾の【所管課】以降を除く）の内訳（分け方が事業）が1つだけあるとき、その内訳。さらにその子孫に、シートの事業名と同じ名前の事業の内訳が1つだけあれば、そちらの内訳。fiscal_expenditure_detail の detail_id。1つの内訳に複数の小事業（シート）が入ることがあり、そのときシートの決算額は内訳の額より小さい。
    data_tests:
    - relationships:
        arguments:
          to: ref('expenditure_detail')
          field: detail_id
- name: evaluation_indicator
  description: 評価シートの指標。シートに印字された順に1つが1行。
  columns:
  - name: indicator_id
    description: 行の ID。シートと指標の順から作る（sha256）。
    data_tests: [not_null, unique]
  - name: sheet_id
    description: evaluation_sheet の sheet_id。
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('evaluation_sheet')
          field: sheet_id
  - name: position
    description: シートの中での順（1始まり）。
    data_tests: [not_null]
  - name: name
    description: 指標名。
  - name: unit
    description: 単位（シートの表記）。
  - name: definition
    description: 指標の定義（シートの表記）。
  - name: final_target_text
    description: 目標（達成年度）の欄の値（シートの表記のまま）。
  - name: final_target_year_text
    description: 目標の達成年度（シートの表記のまま、例「令和8年度」）。
- name: evaluation_indicator_value
  description: 指標の年度ごとの目標と実績。値はシートの表記のまま（文字列）。
  columns:
  - name: value_id
    description: 行の ID。指標と年度から作る（sha256）。
    data_tests: [not_null, unique]
  - name: indicator_id
    description: evaluation_indicator の indicator_id。
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('evaluation_indicator')
          field: indicator_id
  - name: fiscal_year
    description: 会計年度（西暦）。
    data_tests: [not_null]
  - name: target_text
    description: その年度の目標（シートの表記のまま）。
  - name: actual_text
    description: その年度の実績（シートの表記のまま）。
- name: evaluation
  description: 事業評価の根。自治体の1年度（評価した事業を行った年度）分の事務事業評価。評価シートか評価結果の資料のどちらかがある年度が1行。
  columns:
  - name: evaluation_id
    description: 自治体コードと年度から作る ID（sha256）。
    data_tests: [not_null, unique]
  - name: jurisdiction_code
    description: 全国地方公共団体コード（6桁）。
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('jurisdiction')
          field: jurisdiction_code
  - name: fiscal_year
    description: 評価した事業を実施した会計年度（西暦）。
    data_tests: [not_null]
  - name: kind
    description: with_result（評価結果の資料があり件数を持つ）か sheets_only（評価シートだけで件数は空）。
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['with_result', 'sheets_only']
  - name: result_origin_id
    description: 評価結果の資料。evaluation_origin の origin_id。sheets_only なら空。
  - name: result_page
    description: 評価結果の資料で合計の行を読んだ頁。
  - name: evaluated_count
    description: 評価した事業の数（評価結果の資料の値）。
  - name: grade_a
    description: A 評価の事業の数（評価結果の資料の値）。
  - name: grade_b
    description: B 評価の事業の数（評価結果の資料の値）。
  - name: grade_c
    description: C 評価の事業の数（評価結果の資料の値）。
  - name: grade_d
    description: D 評価の事業の数（評価結果の資料の値）。
