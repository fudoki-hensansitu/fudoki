version: 2
# Queria の公開データセット fudoki に配る表（serving/queria.py が同名・同列のまま写す）。
# モデル名は queria_<スキーマ>__<テーブル>。説明は Queria の規約（表は概要1文と注意3つまで、列は50字程度）で書く。
# meta.queria.semantic は Queria のキー・集計の宣言。
models:
- name: queria_expenditure__expenditure
  description: |-
    1 行が 1 つの資料（自治体・年度・資料区分・補正号）の 1 つの会計です。

    - 行があることは、その会計の全事業を収録し終えたことを意味しません。
  config:
    meta: {queria: {primary_key: expenditure_id}}
  columns:
  - name: expenditure_id
    description: 自治体・年度・資料区分・補正号・会計名から作る ID。
    data_tests: [not_null, unique]
  - &code
    name: local_government_code
    description: 全国地方公共団体コード（検査数字付き 6 桁）。
    config:
      meta: {queria: {semantic: {role: entity, name: city}}}
    data_tests: [not_null]
  - &year
    name: fiscal_year
    description: 会計年度（西暦）。
    data_tests: [not_null]
  - &kind
    name: document_kind
    description: 資料区分。settlement は決算、initial は当初予算。
    data_tests:
    - not_null
    - accepted_values: {arguments: {values: [settlement, initial]}}
  - &amendment
    name: amendment_number
    description: 補正予算の号数。補正予算は未収録なので常に NULL。
  - &account_name
    name: account_name
    description: 出典に印字された会計名。
    data_tests: [not_null]
  - &account_kind
    name: account_kind
    description: 自治体共通の会計の種類（一般会計・国民健康保険など）。風土記の判断。
    data_tests: [not_null]

- name: queria_expenditure__subject
  description: |-
    1 行が 1 つの資料の歳出の款・項・目の 1 つです。

    - 款・項・目が同じ表に並びます。合計は 1 つの level に絞るか、is_leaf の行だけを足してください。
    - 決算と当初予算は document_kind で必ずどちらかに絞ってください。
  config:
    meta: {queria: {primary_key: subject_id}}
  columns:
  - name: subject_id
    description: 行の ID。
    data_tests: [not_null, unique]
  - name: parent_subject_id
    description: 親の科目の subject_id。款は NULL。
  - &expenditure_id
    name: expenditure_id
    description: 歳出の根（expenditure）の ID。
    data_tests: [not_null]
  - *code
  - *year
  - *kind
  - *amendment
  - &phase
    name: amount_phase
    description: 金額の段階。executed は支出済額、approved は当初予算額。
    data_tests: [not_null]
  - *account_name
  - *account_kind
  - name: level
    description: 科目の段（款・項・目）。
    data_tests:
    - not_null
    - accepted_values: {arguments: {values: [款, 項, 目]}}
  - &code_col
    name: code
    description: 出典に印字された番号。番号の無い段は NULL。
  - &name
    name: name
    description: 出典に印字された名称（NFKC で正規化）。
    data_tests: [not_null]
  - &kan_code
    name: kan_code
    description: 所属する款の番号。
  - &kan_name
    name: kan_name
    description: 所属する款の名称。
  - &kou_code
    name: kou_code
    description: 所属する項の番号。款の行は NULL。
  - &kou_name
    name: kou_name
    description: 所属する項の名称。款の行は NULL。
  - &moku_code
    name: moku_code
    description: 所属する目の番号。款・項の行は NULL。
  - &moku_name
    name: moku_name
    description: 所属する目の名称。款・項の行は NULL。
  - &amount
    name: amount_yen
    description: 金額（円）。決算は支出済額、当初予算は当初予算額。印字の無い段は NULL。
    config:
      meta: {queria: {semantic: {role: measure, agg: sum}}}
  - name: is_leaf
    description: 子の科目を持たないか（目と、目の無い項）。is_leaf の行の和が歳出の総額。
    data_tests: [not_null]
  - name: cofog_status
    description: 目に付けた COFOG の判断（assigned・tentative など）。風土記の判断。
  - name: cofog_code
    description: 目に割り当てた COFOG（政府支出の機能別分類）のコード。風土記の判断。
  - &interfund
    name: is_interfund_transfer
    description: 他の会計への繰出か。風土記の判断で、網羅ではありません。
    data_tests: [not_null]
  - &interfund_to
    name: interfund_transfer_to
    description: 繰出の受け手の会計の種類。特定できなければ NULL。
  - &origin_id
    name: origin_id
    description: 印字された出典（origin）の ID。
    data_tests: [not_null]

- name: queria_expenditure__detail
  description: |-
    1 行が科目（主に目）の下に印字された事業・節などの内訳の 1 つです。

    - 科目（subject）と足さないでください。
    - 同じ科目・同じ breakdown の depth = 1 の行の和が科目の金額です。breakdown を混ぜて足さないでください。
  config:
    meta: {queria: {primary_key: detail_id}}
  columns:
  - name: detail_id
    description: 行の ID。
    data_tests: [not_null, unique]
  - name: parent_detail_id
    description: 親の内訳の detail_id。科目の直下は NULL。
  - name: subject_id
    description: 内訳が属する科目（subject）の ID。
    data_tests: [not_null]
  - *expenditure_id
  - *code
  - *year
  - *kind
  - *amendment
  - *phase
  - *account_name
  - *account_kind
  - *kan_code
  - *kan_name
  - *kou_code
  - *kou_name
  - *moku_code
  - name: moku_name
    description: 所属する目の名称。項の直下の内訳は NULL。
  - name: breakdown
    description: 内訳の分け方（事業・節・その他）。風土記の判断。
    data_tests:
    - not_null
    - accepted_values: {arguments: {values: [事業, 節, その他]}}
  - name: source_heading
    description: 出典の欄の見出し（備考・説明・節など）。
    data_tests: [not_null]
  - name: node_kind
    description: 段の名前（事項・節・細節など）。
    data_tests: [not_null]
  - name: depth
    description: 科目の直下を 1 とする深さ。
    data_tests: [not_null]
  - *code_col
  - *name
  - name: department
    description: 名称の末尾の【】に印字された所管課。無ければ NULL。
  - name: amount_yen
    description: 金額（円）。決算は支出済額、当初予算は当初予算額。
    config:
      meta: {queria: {semantic: {role: measure, agg: sum}}}
  - name: is_leaf
    description: 子の内訳を持たないか。
    data_tests: [not_null]
  - name: is_subject_remainder
    description: 子の科目と並んで科目の金額の一部になる枝か（神戸市の一部の項）。
    data_tests: [not_null]
  - name: expenditure_setsu_id
    description: 節の欄の行に対応する法定の歳出の節の ID。節以外は NULL。
  - *interfund
  - *interfund_to
  - *origin_id

- name: queria_expenditure__origin
  description: 1 行が歳出の取り込みに使った出典（自治体の予算書・決算書）の 1 ファイルです。
  config:
    meta: {queria: {primary_key: origin_id}}
  columns:
  - name: origin_id
    description: 出典の ID。
    data_tests: [not_null, unique]
  - *code
  - *year
  - name: document_kind
    description: 資料区分。settlement は決算、initial は当初予算。
    data_tests: [not_null]
  - name: amendment_number
    description: 補正予算の号数。補正予算以外は NULL。
  - name: title
    description: 出典の資料名。
    data_tests: [not_null]
  - name: source_url
    description: 自治体が出典を公開している URL。
    data_tests: [not_null]
  - name: format
    description: 出典の形式（pdf か csv）。
    data_tests: [not_null]

- name: queria_expenditure__origin_link
  description: |-
    1 行が歳出の根（expenditure）と出典（origin）の組です。

    - 1 つの冊が複数の会計にまたがり、1 つの会計が複数の冊に分かれることがあります。
  config:
    meta: {queria: {primary_key: link_id}}
  columns:
  - name: link_id
    description: expenditure_id と origin_id から作る ID。
    data_tests: [not_null, unique]
  - *expenditure_id
  - *origin_id
