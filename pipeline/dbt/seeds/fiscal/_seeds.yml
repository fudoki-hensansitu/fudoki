version: 2

seeds:
  - name: cofog_rules
    meta:
      # **判断そのもの。** これを適用した下流は fudoki の言い分を含む。
      role: judgment-rule
    description: |
      COFOG の割り当て規則。**fudoki の判断そのもの**なのでデータとして持つ。
      団体限定規則を先に当て、次に共通規則を当てる。各群は priority の小さい順に採る。
      applies_to が空の規則は団体共通の語彙辞書で、どの団体にも効く。
      ⚠️ **名称で当たらない団体がある。** 狛江市は款・項・目に名称の列が原典に無いので、
      名称を条件にした規則は1本も当たらない。名称を捏造せず `match_kan_code` で当て、
      何の款かとその出所を basis に書く。
      `tentative` が true の規則が当たった目は、コードを付けたまま `cofog_status` を `tentative` にする。人が確かめたら印を外せば `assigned` に戻る。
    config:
      # 団体コードは数値ではなく識別子。推論に任せると先頭ゼロが落ち、
      # match_* も値によって型が揺れる。
      column_types:
        priority: integer
        rule_id: varchar
        applies_to: varchar
        match_fund: varchar
        match_account_kind: varchar
        match_kan: varchar
        match_kou: varchar
        match_kan_code: varchar
        match_moku: varchar
        moku_mode: varchar
        match_setsu: varchar
        status: varchar
        cofog_code: varchar
        consolidation: varchar
        decided_at_level: varchar
        counterpart_fund: varchar
        basis: varchar
        tentative: boolean
    columns:
      - name: rule_id
        data_tests: [unique, not_null]
      - name: priority
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              values: [assigned, unclassifiable, out-of-scope]
      - name: tentative
        data_tests: [not_null]
      - name: consolidation
        data_tests:
          - accepted_values:
              values: [retained, eliminated]

  - name: account_kind_map
    meta:
      # **判断そのもの。** 原典の会計名と団体共通の種類の対応。
      role: judgment-rule
    description: |
      会計名に含まれる語と団体共通の会計の種類（一般会計・国民健康保険・介護保険・
      後期高齢者医療・用地・駐車場・下水道・介護サービス事業・土地区画整理。受け手だけに「不明」）の対応。**fudoki の判断。** 同じ制度の会計の呼び名は
      団体で違う（「介護保険特別会計」「介護保険事業会計」「介護保険会計」）ので、
      団体ごとの行は持たず語で対応づける。`fund_directory` は団体×会計名の完全一致で
      団体ごとに行が要るため使わない（[ADR 0023](../../../../docs/adr/0023-account-kind-and-no-consolidation.md)）。
      account_kind が空の行（他会計）は、会計間の繰出の受け手が特定できないことを表す —
      印は付けるが受け手の種類は付けない。受け手が「特別会計」とだけ印字され会計を特定できない
      繰出金は、推測せず受け手の種類を「不明」にする（`scope` が `recipient` の行。受け手の名前が語と
      完全に一致するときだけ当たり、会計名には当たらない）。語に当たらない会計名・受け手は構築を止める。
    config:
      fast: false
      column_types:
        keyword: varchar
        account_kind: varchar
        basis: varchar
        scope: varchar
    columns:
      - name: keyword
        data_tests: [unique, not_null]

  - name: setsu_name_variants
    meta:
      # **判断そのもの。** 原典と法定の表記差の寄せ方は自治体が言っていないこと。
      role: judgment-rule
    description: |
      原典の節の名称と法定の節の名称の表記差の対応。区切りの記号を除いた形で引く。
      **fudoki の判断。** 異体字・ひらがな表記（寄付→寄附、補てん・補填→補塡）を
      法定の表記に寄せる。ここに無い表記差は黙って寄せず、節の軸に未知の名称が
      現れたら構築を止める。
    config:
      column_types:
        variant: varchar
        canonical: varchar
        basis: varchar
    columns:
      - name: variant
        data_tests: [unique, not_null]

