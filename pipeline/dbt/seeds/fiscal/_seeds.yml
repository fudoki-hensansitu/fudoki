version: 2

seeds:
  - name: cofog_rules
    meta:
      # **判断そのもの。** これを適用した下流は fudoki の言い分を含む。
      role: judgment-rule
    description: |
      COFOG の割り当て規則。**fudoki の判断そのもの**なのでデータとして持つ。
      自治体限定規則を先に当て、次に共通規則を当てる。各群は priority の小さい順に採る。
      applies_to が空の規則は自治体共通の語彙辞書で、どの自治体にも効く。
      ⚠️ **名称で当たらない自治体がある。** 狛江市は款・項・目に名称の列が出典に無いので、
      名称を条件にした規則は1本も当たらない。名称を捏造せず `match_kan_code` で当て、
      何の款かとその出所を basis に書く。
      `tentative` が true の規則が当たった目は、コードを付けたまま `cofog_status` を `tentative` にする。人が確かめたら印を外せば `assigned` に戻る。
    config:
      # 自治体コードは数値ではなく識別子。推論に任せると先頭ゼロが落ち、
      # match_* も値によって型が揺れる。
      column_types:
        priority: integer
        rule_id: varchar
        applies_to: varchar
        match_fund: varchar
        match_account_kind: varchar
        match_kan: varchar
        match_kou: varchar
        match_kan_code: varchar
        match_moku: varchar
        moku_mode: varchar
        match_setsu: varchar
        status: varchar
        cofog_code: varchar
        consolidation: varchar
        decided_at_level: varchar
        counterpart_fund: varchar
        basis: varchar
        tentative: boolean
    columns:
      - name: rule_id
        data_tests: [unique, not_null]
      - name: priority
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              values: [assigned, unclassifiable, out-of-scope]
      - name: tentative
        data_tests: [not_null]
      - name: consolidation
        data_tests:
          - accepted_values:
              values: [retained, eliminated]

  - name: account_kind_map
    meta:
      # **判断そのもの。** 出典の会計名と自治体共通の種類の対応。
      role: judgment-rule
    description: |
      会計名に含まれる語と自治体共通の会計の種類（一般会計・国民健康保険・介護保険・
      後期高齢者医療・用地・駐車場・下水道・介護サービス事業・土地区画整理・財産区・学校給食費など。受け手だけに「不明」）の対応。**fudoki の判断。** 同じ制度の会計の呼び名は
      自治体で違う（「介護保険特別会計」「介護保険事業会計」「介護保険会計」）ので、
      自治体ごとの行は持たず語で対応づける。`fund_directory` は自治体×会計名の完全一致で
      自治体ごとに行が要るため使わない（[ADR 0023](../../../../docs/adr/0023-account-kind-and-no-consolidation.md)）。
      account_kind が空の行（他会計）は、会計間の繰出の受け手が特定できないことを表す —
      印は付けるが受け手の種類は付けない。受け手が「特別会計」とだけ印字され会計を特定できない
      繰出金は、推測せず受け手の種類を「不明」にする（`scope` が `recipient` の行。受け手の名前が語と
      完全に一致するときだけ当たり、会計名には当たらない）。語に当たらない会計名・受け手は構築を止める。
    config:
      fast: false
      column_types:
        keyword: varchar
        account_kind: varchar
        basis: varchar
        scope: varchar
    columns:
      - name: keyword
        data_tests: [unique, not_null]

  - name: setsu_name_variants
    meta:
      # **判断そのもの。** 出典と法定の表記差の寄せ方は自治体が言っていないこと。
      role: judgment-rule
    description: |
      出典の節の名称と法定の節の名称の表記差の対応。区切りの記号を除いた形で引く。
      **fudoki の判断。** 異体字・ひらがな表記（寄付→寄附、補てん・補填→補塡）を
      法定の表記に寄せる。ここに無い表記差は黙って寄せず、節の軸に未知の名称が
      現れたら構築を止める。
    config:
      column_types:
        variant: varchar
        canonical: varchar
        basis: varchar
    columns:
      - name: variant
        data_tests: [unique, not_null]

  - name: fiscal_budget_amendment
    meta:
      role: source-declaration
    description: |
      議会の修正案で当初予算を直す表の宣言。予算説明書が原案の額で印字され、議会が修正して可決した資料を1行で示す。
      `table_id` は同じ自治体・年度・資料区分の修正案の表（修正した事務事業だけを、修正金額を本年度予算額・原案金額を予算案額として持つ）。
      この表のノードは木に加えず、各行の 修正金額−原案金額 を、予算説明書の同じノードとその祖先（款まで）の承認額に足す
      （int_fiscal__settlement_expenditure_nodes）。修正案が書かない枝（節など）は原案の額のまま残る。
    config:
      column_types:
        jurisdiction_code: varchar
        fiscal_year: integer
        document_kind: varchar
        table_id: varchar
        basis: varchar
    columns:
      - name: document_kind
        data_tests:
          - accepted_values:
              arguments:
                values: ['initial']
      - name: basis
        data_tests: [not_null]
  - name: fiscal_kan_name_identity
    meta:
      # **判断そのもの。** 款を番号でなく名前で同定する会計・年度の宣言。
      role: judgment-rule
    description: |
      款を番号でなく名前で同定する自治体・年度・会計。**fudoki の判断。** 款の id（node_id）は款の番号から作るが、
      出典が款の番号を印字しない、または年度の途中で番号を振り直して資料ごとに同じ番号が別の款を指す会計では、
      その年度・会計のすべての資料（当初予算・決算）で款の名前から作る。番号を印字しない款（code が空）の id は、
      ここに無い会計でも款の名前から作る。金額が 0 でない番号の無い款は、ここで宣言した会計でだけ許す
      （tests/fiscal_rows_contract.sql）。金額 0 の番号の無い款（その年度で無くなり、前年度の額と並べて印字される款）は宣言なしで許す。
    config:
      column_types:
        jurisdiction_code: varchar
        fiscal_year: integer
        account_name: varchar
        basis: varchar
    columns:
      - name: basis
        data_tests: [not_null]
  - name: fiscal_subject_name_fill
    meta:
      # **判断そのもの。** 出典が番号だけを印字した款・項の名前。
      role: judgment-rule
    description: |
      出典が番号だけを印字し名前を印字しない款・項に付ける名前。**fudoki の判断。** 自治体・年度・資料区分・会計・段・款の番号
      （項は款と項の番号）ごとに1行で、同じ自治体の決算などで同じ番号の款・項の名前を、その下の目の名前が全部一致することを
      確かめてから宣言する。取り込みの表は印字のまま名前を空に保ち、int_fiscal__settlement_expenditure_rows が名前の空いた款・項にだけ当てる。
      確かめられない会計・年度（目の並びが違う）は宣言せず、dbt の入力から外したままにする。
    config:
      column_types:
        jurisdiction_code: varchar
        fiscal_year: integer
        document_kind: varchar
        account_name: varchar
        node_kind: varchar
        kan_code: varchar
        kou_code: varchar
        name: varchar
        basis: varchar
    columns:
      - name: node_kind
        data_tests:
          - accepted_values:
              arguments:
                values: ['款', '項']
      - name: name
        data_tests: [not_null]
      - name: basis
        data_tests: [not_null]
  - name: fiscal_detail_breakdown
    meta:
      # **判断そのもの。** 内訳の枝の分け方の宣言。
      role: judgment-rule
    description: |
      内訳の枝の根（科目の直下）の見出しに付ける分け方。**fudoki の判断。** 出典（自治体・年度・資料区分）×見出しごとに1行で、
      全自治体に効く行は持たない（同じ「備考」でも、事業を並べる自治体と経費の品目を並べる自治体がある）。
      `事業` は科目の額を事業ごとに分けたもの、`節` は法定の節で分けたもの、`その他` は事業とも法定の節とも言えない出典の内訳、
      `除外` は配らない枝（金額でない・重複・財源の内訳）。根の分け方は子孫へ継ぎ、子孫の見出しはここで引かない。
      行が無い見出しは検査 fiscal_detail_breakdown_declared が止める。新しい出典では目の直下の名称を見て行を書き、basis に確かめた中身を書く
      （docs/prd/fiscal-serving-tables/dd.md）。
    config:
      column_types:
        jurisdiction_code: varchar
        fiscal_year: integer
        document_kind: varchar
        source_heading: varchar
        breakdown: varchar
        basis: varchar
    columns:
      - name: breakdown
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['事業', '節', 'その他', '除外']
      - name: basis
        data_tests: [not_null]
