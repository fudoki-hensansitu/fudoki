version: 2
seeds:
- name: fiscal_amount_map
  description: 取り込みと共有する資料区分・見出し経路または末尾の金額段階辞書。資料区分が空なら全資料共通。空のphaseは段階を持たない合計欄。
  config:
    fast: false
    column_types:
      document_kind: varchar
      header: varchar
      phase: varchar
  columns:
  - name: header
    data_tests: [not_null]
  - name: phase
    data_tests:
    - accepted_values:
        values: [proposed, approved, adjusted, adjusted-before-transfer, executed]
- name: cofog_master
  description: packages/fiscal/cofog-master.ts のコードと名称から scripts/generate_cofog_master.ts
    で生成（ADR 0016）。親はコードの末尾の段を削って求める。
  config:
    column_types:
      cofog_code: varchar
      name: varchar
  columns:
  - name: cofog_code
    data_tests:
    - unique
    - not_null
  - name: name
    data_tests:
    - not_null
- name: setsu_master
  description: packages/fiscal/setsu-master.ts の法定の節の区分と適用期間から scripts/generate_setsu_master.ts
    で生成（正本は ts のまま）。ID は現行体系が setsu-<番号>、令和元年度以前だけの区分が setsu-<番号>-2019。
  config:
    column_types:
      expenditure_setsu_id: varchar
      code: varchar
      label: varchar
      valid_from_fiscal_year: integer
      valid_to_fiscal_year: integer
      legal_basis: varchar
  columns:
  - name: expenditure_setsu_id
    data_tests:
    - unique
    - not_null
  - name: label
    data_tests:
    - not_null
