# DuckDB は対象別の管理JSONから `ingestion:restore` で復元した Parquet を変換する作業用ファイル。
# .gitignore 済み。
fudoki:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ../.build/warehouse.duckdb
      threads: 1
      plugins:
        - module: staging
      settings:
        memory_limit: '4GB'
        # DuckDB 2.0.0 は並列実行で dict-surviving cache の INTERNAL Error を出す
        # (duckdb/duckdb#28268, #27205)。上の threads は dbt の並列数で、こちらが
        # DuckDB 自身の実行スレッド数。修正版 (2.0.1 以降) へ上げたら外す。
        threads: 1
